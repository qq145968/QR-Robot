name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-disabled: false

    - name: Cache Android SDK
      uses: actions/cache@v4
      id: sdk-cache
      with:
        path: /usr/local/lib/android/sdk
        key: android-sdk-34-buildtools34

    - name: Cache Gradle build outputs
      uses: actions/cache@v4
      with:
        path: |
          app/build/intermediates
          .gradle
        key: gradle-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'app/src/main/**/*.kt', 'app/src/main/**/*.xml') }}
        restore-keys: |
          gradle-build-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Replace maven mirrors for GitHub CI
      run: |
        cat > settings.gradle.kts << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.name = "ScanRobot"
        include(":app")
        EOF

    - name: Build Release APK
      env:
        JAVA_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true"
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: scan-robot-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Deploy APK to Server (main branch only)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASS }}
        fingerprint: ${{ secrets.SSH_HOSTKEY }}
        source: "app/build/outputs/apk/release/*.apk"
        target: ${{ secrets.APK_DEPLOY_PATH }}
        strip_components: 3
