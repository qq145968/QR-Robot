name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签 (例如 v1.0.7)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          app/build/intermediates
        key: release-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          release-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Use official maven mirrors (CI)
      run: |
        cat > settings.gradle.kts << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.name = "ScanRobot"
        include(":app")
        EOF

    - name: Build Release APK
      env:
        JAVA_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Extract version
      id: ver
      run: |
        v=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
        echo "version=$v" >> $GITHUB_OUTPUT
        echo "Resolved version: $v"

    - name: Rename APK
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/release/*.apk "artifacts/ScanRobot-v${{ steps.ver.outputs.version }}.apk"
        ls -la artifacts

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        name: ScanRobot ${{ github.event.inputs.tag || github.ref_name }}
        generate_release_notes: true
        files: artifacts/*.apk

    - name: Deploy APK to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASS }}
        fingerprint: ${{ secrets.SSH_HOSTKEY }}
        source: "artifacts/ScanRobot-v${{ steps.ver.outputs.version }}.apk"
        target: ${{ secrets.APK_DEPLOY_PATH }}
        strip_components: 1

    - name: Update version info on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASS }}
        fingerprint: ${{ secrets.SSH_HOSTKEY }}
        script: |
          ls -la ${{ secrets.APK_DEPLOY_PATH }}/ScanRobot-v${{ steps.ver.outputs.version }}.apk
          echo "APK deployed successfully"
